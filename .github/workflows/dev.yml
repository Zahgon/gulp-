name: dev
on:
  pull_request:
  push:
    branches:
      - master
      - main
env:
  CI: true

jobs:
  test:
    name: Tests for Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.24', '1.25']
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set Go version
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - run: go version

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
